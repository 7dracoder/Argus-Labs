[project]
name = "roboforge"
version = "0.1.0"
description = "RoboForge Engine: AI robotics design backend (skeleton, finance-first)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    "google-genai==2.29.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["roboforge", "roboforge.finance"]
